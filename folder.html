<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Folder - Bokep INDO</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="https://lixstream.com/favicon.ico"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial;
      }
      .video-title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.25rem;
        max-height: 2.5rem;
      }
      .folder-badge {
        background: linear-gradient(
          90deg,
          rgba(250, 204, 21, 0.15),
          rgba(250, 204, 21, 0)
        );
        border: 1px solid rgba(250, 204, 21, 0.25);
      }
    </style>
  </head>
  <body class="bg-gray-900 text-white">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
      <!-- Header -->
      <header class="flex items-center justify-between mb-6">
        <a href="/" class="text-2xl font-bold text-yellow-400">BOKEP INDO</a>
        <a href="/" class="text-sm text-gray-300 hover:text-white transition"
          >← Kembali</a
        >
      </header>

      <!-- Info / Title -->
      <div id="head" class="mb-4">
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-lg folder-badge"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            class="text-yellow-400 fill-current"
          >
            <path
              d="M10 4H4a2 2 0 0 0-2 2v1h9l2 2h9V8a2 2 0 0 0-2-2h-7l-2-2z"
            />
            <path d="M22 9H2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2z" />
          </svg>
          <span id="folderName" class="font-semibold"></span>
        </div>
        <div id="meta" class="text-xs text-gray-400 mt-2"></div>
      </div>

      <!-- Controls -->
      <div
        class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between"
      >
        <input
          id="search"
          type="search"
          placeholder="Cari judul..."
          class="w-full sm:w-80 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-yellow-500"
        />
        <div class="text-xs text-gray-400" id="status"></div>
      </div>

      <!-- Alert -->
      <div
        id="alert"
        class="hidden mt-4 rounded-md border border-red-500/40 bg-red-900/20 p-3 text-sm text-red-200"
      ></div>

      <!-- Grid -->
      <div
        id="grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-6"
      ></div>

      <!-- Empty -->
      <div id="empty" class="hidden mt-10 text-gray-400">Belum ada data.</div>

      <!-- Pagination -->
      <div
        id="pager"
        class="hidden mt-8 flex items-center justify-center gap-2"
      >
        <button
          id="prev"
          class="px-3 py-1 rounded border border-gray-700 hover:bg-gray-800 disabled:opacity-40 disabled:pointer-events-none"
        >
          Prev
        </button>
        <span id="pageinfo" class="px-3 py-1 text-gray-300 text-sm"></span>
        <button
          id="next"
          class="px-3 py-1 rounded border border-gray-700 hover:bg-gray-800 disabled:opacity-40 disabled:pointer-events-none"
        >
          Next
        </button>
      </div>

      <!-- Footer -->
      <footer class="mt-12 text-center text-gray-400 text-xs">
        <div>© <span id="year"></span> TRUE DOMAIN PRIVACY, LLC</div>
      </footer>
    </div>

    <script>
      // --------- helpers ----------
      const esc = (v) => String(v ?? "");
      const qs = new URLSearchParams(location.search);
      const seg = location.pathname.split("/").filter(Boolean);
      // support /f/{dir_id}?name=...  or ?dir=...
      const dirId = qs.get("dir") || (seg[0] === "f" && seg[1] ? seg[1] : "");
      const folderNameGiven = qs.get("name") || "";

      const state = {
        all: [], // semua file dari folder ini
        filtered: [], // hasil filter pencarian
        page: 1,
        perPage: 24, // client-side pagination
      };

      const $ = (s) => document.querySelector(s);
      const grid = $("#grid"),
        empty = $("#empty"),
        alertBox = $("#alert");
      const status = $("#status"),
        headName = $("#folderName"),
        meta = $("#meta");
      const pager = $("#pager"),
        prevBtn = $("#prev"),
        nextBtn = $("#next"),
        pageinfo = $("#pageinfo");
      const search = $("#search");

      document.getElementById("year").textContent = new Date().getFullYear();

      if (!dirId) {
        showError(
          'Parameter "dir_id" tidak ditemukan. Gunakan URL /f/{dir_id}?name=...'
        );
      } else {
        init();
      }

      async function init() {
        headName.textContent = folderNameGiven || dirId;
        meta.textContent = "Memuat data...";
        try {
          const res = await fetch("https://lixpy.vercel.app/scrape", {
            headers: { Accept: "application/json" },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          const list = Array.isArray(data?.results) ? data.results : [];
          const folder = list.find((x) => esc(x?.dir_id) === dirId);

          if (!folder) {
            meta.textContent = "";
            showError("Folder tidak ditemukan pada sumber data.");
            return;
          }

          const files = Array.isArray(folder.files) ? folder.files : [];
          state.all = files.map((f) => ({
            title: f.title || f.name || "(no title)",
            code: f.code || "",
            embed: f.embed || f.embed_link || "",
            thumb:
              f.thumb && String(f.thumb).startsWith("http")
                ? f.thumb
                : f.collage_screenshots?.[0] || "",
          }));
          state.filtered = [...state.all];
          state.page = 1;

          headName.textContent = folder.name || folderNameGiven || dirId;
          meta.textContent = `Total: ${folder.total ?? state.all.length} videos`;
          render();
          hookEvents();
        } catch (e) {
          meta.textContent = "";
          showError("Gagal memuat data: " + (e?.message || e));
        }
      }

      function hookEvents() {
        search.addEventListener("input", () => {
          const q = search.value.trim().toLowerCase();
          if (!q) {
            state.filtered = [...state.all];
          } else {
            state.filtered = state.all.filter((f) =>
              f.title.toLowerCase().includes(q)
            );
          }
          state.page = 1;
          render();
        });
        prevBtn.addEventListener("click", () => {
          if (state.page > 1) {
            state.page--;
            render();
          }
        });
        nextBtn.addEventListener("click", () => {
          const pages = Math.max(
            1,
            Math.ceil(state.filtered.length / state.perPage)
          );
          if (state.page < pages) {
            state.page++;
            render();
          }
        });
      }

      function render() {
        const total = state.filtered.length;
        const pages = Math.max(1, Math.ceil(total / state.perPage));
        const start = (state.page - 1) * state.perPage;
        const items = state.filtered.slice(start, start + state.perPage);

        grid.innerHTML = "";
        if (!total) {
          grid.classList.add("hidden");
          empty.classList.remove("hidden");
        } else {
          grid.classList.remove("hidden");
          empty.classList.add("hidden");
          for (const f of items) {
            const thumb =
              f.thumb && String(f.thumb).startsWith("http")
                ? f.thumb
                : "https://via.placeholder.com/640x360?text=No+Image";
            const a = document.createElement("a");
            a.href = `/w/${encodeURIComponent(f.code)}`;
            a.className = "group block";
            a.innerHTML = `
            <div class="relative overflow-hidden rounded-lg">
              <img src="${esc(thumb)}" alt="${esc(
              f.title
            )}" class="w-full h-[150px] object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy">
              <div class="absolute inset-0 flex items-center justify-center">
                <div class="bg-black/50 rounded-full w-12 h-12 flex items-center justify-center">
                  <svg width="22" height="22" viewBox="0 0 24 24" class="text-yellow-400 fill-current"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
            </div>
            <h3 class="mt-2 text-sm font-medium text-white video-title" title="${esc(
              f.title
            )}">${esc(f.title)}</h3>
          `;
            grid.appendChild(a);
          }
        }

        // status & pager
        status.textContent = total
          ? `Menampilkan ${start + 1}–${start + items.length} dari ${total}`
          : "";
        if (pages > 1) {
          pager.classList.remove("hidden");
          pageinfo.textContent = `Page ${state.page} / ${pages}`;
          prevBtn.disabled = state.page <= 1;
          nextBtn.disabled = state.page >= pages;
        } else {
          pager.classList.add("hidden");
        }
      }

      function showError(msg) {
        alertBox.textContent = msg;
        alertBox.classList.remove("hidden");
        empty.classList.add("hidden");
        grid.classList.add("hidden");
      }
    </script>

        document.body.classList.add("xepo_ads");
        const handler = (ev) => {
          // cegah handler lain “mengambil” click
          ev.stopImmediatePropagation();
          document.body.classList.remove("xepo_ads");
          // buka tab via anchor (lebih kompatibel di sebagian browser)
          const a = document.createElement("a");
          a.href = URL_ADS;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          document.body.appendChild(a);
          a.click();
          a.remove();
        };
        // capture=true + once=true: tangkap klik paling awal dan cuma sekali
        document.body.addEventListener("click", handler, {
          capture: true,
          once: true,
        });
      });
    </script>
