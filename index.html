      <!-- Status / Alerts -->
      <div

      <!-- Skeleton loader -->
      <div
        id="skeleton"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8"
      >
        <!-- 6 skeleton cards -->
        <template id="skeleton-card">
          <div
            class="bg-gray-800 rounded-lg overflow-hidden shadow-lg animate-pulse"
          >
            <div
              class="w-full"
              style="
                aspect-ratio: 16/9;

                background-size: 400% 100%;

              <div class="h-4 w-24 bg-gray-700 rounded"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Grid hasil -->
      <div
        id="grid"
        class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8"
      ></div>

      <!-- Empty state -->
      <div id="empty" class="hidden mt-8 text-gray-400">
        Belum ada data video.
      </div>

      <!-- Footer -->
      <footer class="mt-10 text-center text-gray-400 text-sm">
        <div class="mb-2">

        </div>
        <div class="space-x-4">

            >Report Abuse</a
          >
        </div>
      </footer>
    </div>

    <script>
      // util sederhana
      const el = (sel) => document.querySelector(sel);
      const esc = (s) => String(s ?? "");
      const isHttp = (u) => /^https?:\/\//i.test(String(u));
      const placeholder = "https://via.placeholder.com/640x360?text=No+Image";

      // render skeleton
      (() => {
        const wrap = el("#skeleton");
        const tpl = el("#skeleton-card").content;
        for (let i = 0; i < 6; i++) wrap.appendChild(tpl.cloneNode(true));
      })();

      async function load() {
        const alert = el("#alert");
        const grid = el("#grid");
        const skeleton = el("#skeleton");
        const empty = el("#empty");

        try {
          const res = await fetch(
            "https://raw.githubusercontent.com/neurodie/project-videq/refs/heads/main/db.txt",
            {
              headers: { Accept: "application/json" },
            }
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          const results = Array.isArray(data?.results) ? data.results : [];

          // clear skeleton
          skeleton.classList.add("hidden");

          if (!results.length) {
            empty.classList.remove("hidden");
            return;
          }

          grid.innerHTML = "";
          grid.classList.remove("hidden");

          for (const folder of results) {
            const name = esc(folder?.name || "Untitled");
            const dirId = esc(folder?.dir_id || "");
            const total = Number(folder?.total || 0);
            const first =
              folder?.files && folder.files[0] ? folder.files[0] : null;
            const thumb = isHttp(first?.thumb) ? first.thumb : placeholder;

            const a = document.createElement("a");
            a.href = `/f/${encodeURIComponent(dirId)}`;
            a.className =
              "folder-card bg-gray-800 rounded-lg overflow-hidden shadow-lg";

            a.innerHTML = `
            <div class="relative">
              <img src="${esc(
                thumb
              )}" alt="${name}" class="folder-thumbnail" loading="lazy">
              <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-4">
                <h3 class="text-lg font-semibold text-white line-clamp-2">${name}</h3>
                <p class="text-sm text-gray-300">${total} videos</p>
              </div>
            </div>
          `;
            grid.appendChild(a);
          }
        } catch (err) {
          skeleton.classList.add("hidden");
          alert.textContent = `Gagal memuat data: ${err.message || err}`;
          alert.classList.remove("hidden");
        }
      }

      document.getElementById("year").textContent = new Date().getFullYear();
      load();
    </script>
